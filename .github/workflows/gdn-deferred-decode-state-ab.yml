name: GDN Deferred Decode State A/B

on:
  workflow_dispatch:
  push:
    branches: [perf/gdn-deferred-decode-state]
    paths:
      - vllm_metal/experimental/gdn_deferred_decode_state.py
      - vllm_metal/envs.py
      - vllm_metal/__init__.py
      - tests/test_gdn_deferred_decode_state.py
      - tools/benchmark/gdn_align_cold_scaling.py
      - .github/workflows/gdn-deferred-decode-state-ab.yml

permissions:
  contents: read

concurrency:
  group: gdn-deferred-decode-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MODEL_DIR: /tmp/Qwen3.5-0.8B-4bit-mtp
      RESULT_DIR: /tmp/gdn-deferred-decode-state-ab
      MLX_LM_REF: ac6aaffd8fdfb8c8e713e17f155d83e3d72b0a0f
      GLOO_SOCKET_IFNAME: lo0
      VLLM_METAL_USE_PAGED_ATTENTION: "1"
      VLLM_METAL_MEMORY_FRACTION: auto
      VLLM_METAL_GDN_LAZY_KERNELS: "1"
      VLLM_METAL_DECODE_PIPELINE: "1"
      VLLM_ENABLE_V1_MULTIPROCESSING: "0"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache converted benchmark model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: qwen35-08b-4bit-mtp-${{ env.MLX_LM_REF }}

      - name: Install vLLM Metal and exact mlx-lm MTP head
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip uv
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install \
            'https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl'
          VLLM_METAL_BUILD_FROM_SOURCE=1 python -m pip install -e '.[dev]'
          python -m pip install --force-reinstall --no-deps \
            "git+https://github.com/PhilipJohnBasile/mlx-lm@${MLX_LM_REF}"
          source scripts/lib.sh
          ensure_metal_toolchain
          build_native_artifacts
          python - <<'PY'
          import mlx.core as mx
          import torch
          print('MLX:', mx.__version__)
          print('device:', mx.device_info())
          print('MPS:', torch.backends.mps.is_available())
          assert torch.backends.mps.is_available()
          PY

      - name: Convert Qwen3.5-0.8B when cache is cold
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          if [ ! -f "$MODEL_DIR/config.json" ]; then
            rm -rf "$MODEL_DIR"
            python -m mlx_lm convert \
              --hf-path Qwen/Qwen3.5-0.8B \
              --mlx-path "$MODEL_DIR" \
              -q --q-bits 4 --q-group-size 64
          fi
          python - <<'PY'
          import os
          from mlx_lm.utils import load
          model, _ = load(os.environ['MODEL_DIR'])
          assert bool(getattr(model, 'supports_mtp', False))
          assert model.make_mtp_cache()
          print('native Qwen MTP model ready')
          PY

      - name: Run focused correctness tests
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          VLLM_METAL_GDN_DEFER_DECODE_STATE=1 pytest -q \
            tests/test_gdn_deferred_decode_state.py \
            tests/test_gdn_lazy_wrapper.py \
            tests/attention/test_align_gdn_state_manager.py \
            tests/test_qwen_native_mtp_proposer.py \
            tests/test_qwen_mtp_paged_cache.py

      - name: Run cache-off and cache-on A/B probes
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"

          VLLM_METAL_GDN_DEFER_DECODE_STATE=0 \
            python tools/benchmark/gdn_align_cold_scaling.py \
              --model "$MODEL_DIR" \
              --mode off \
              --output "$RESULT_DIR/cache-off.json" \
              --prompt-tokens 1152 \
              --probe-output-tokens 64 \
              --stages 0,8,24 \
              --max-num-seqs 8 \
              --max-num-batched-tokens 2048 \
              2>&1 | tee "$RESULT_DIR/cache-off.log"

          VLLM_METAL_GDN_DEFER_DECODE_STATE=0 \
            python tools/benchmark/gdn_align_cold_scaling.py \
              --model "$MODEL_DIR" \
              --mode on \
              --output "$RESULT_DIR/cache-on-control.json" \
              --prompt-tokens 1152 \
              --probe-output-tokens 64 \
              --stages 0,8,24 \
              --max-num-seqs 8 \
              --max-num-batched-tokens 2048 \
              2>&1 | tee "$RESULT_DIR/cache-on-control.log"

          VLLM_METAL_GDN_DEFER_DECODE_STATE=1 \
            python tools/benchmark/gdn_align_cold_scaling.py \
              --model "$MODEL_DIR" \
              --mode on \
              --output "$RESULT_DIR/cache-on-deferred.json" \
              --prompt-tokens 1152 \
              --probe-output-tokens 64 \
              --stages 0,8,24 \
              --max-num-seqs 8 \
              --max-num-batched-tokens 2048 \
              2>&1 | tee "$RESULT_DIR/cache-on-deferred.log"

      - name: Compare A/B and publish summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RESULT_DIR'])
          paths = {
              'cache_off': root / 'cache-off.json',
              'control': root / 'cache-on-control.json',
              'deferred': root / 'cache-on-deferred.json',
          }
          missing = [name for name, path in paths.items() if not path.exists()]
          if missing:
              report = '# Deferred GDN decode-state A/B\n\nMissing result arms: ' + ', '.join(missing) + '\n'
              (root / 'summary.md').write_text(report)
              print(report)
              raise SystemExit(0)

          data = {name: json.loads(path.read_text()) for name, path in paths.items()}
          indexed = {
              name: {row['retained_prompt_target']: row for row in arm['results']}
              for name, arm in data.items()
          }
          stages = sorted(indexed['control'])
          parity = all(
              indexed['control'][stage]['output_sha256']
              == indexed['deferred'][stage]['output_sha256']
              for stage in stages
          )

          rows = []
          for stage in stages:
              off = indexed['cache_off'][stage]
              control = indexed['control'][stage]
              deferred = indexed['deferred'][stage]
              rows.append({
                  'stage': stage,
                  'cache_off_output_tok_s': off['wall_output_tok_s'],
                  'control_output_tok_s': control['wall_output_tok_s'],
                  'deferred_output_tok_s': deferred['wall_output_tok_s'],
                  'deferred_vs_control': (
                      deferred['wall_output_tok_s'] / control['wall_output_tok_s']
                  ),
                  'control_vs_cache_off': (
                      control['wall_output_tok_s'] / off['wall_output_tok_s']
                  ),
                  'deferred_vs_cache_off': (
                      deferred['wall_output_tok_s'] / off['wall_output_tok_s']
                  ),
                  'control_ttft_ms': control['ttft_ms'],
                  'deferred_ttft_ms': deferred['ttft_ms'],
                  'control_decode_tok_s': control['decode_tok_s'],
                  'deferred_decode_tok_s': deferred['decode_tok_s'],
                  'output_sha256': deferred['output_sha256'],
              })

          def geometric_mean(values):
              product = 1.0
              for value in values:
                  product *= value
              return product ** (1.0 / len(values))

          speedup = geometric_mean([row['deferred_vs_control'] for row in rows])
          last_stage = stages[-1]
          control_degradation = (
              indexed['control'][last_stage]['wall_output_tok_s']
              / indexed['control'][stages[0]]['wall_output_tok_s']
          )
          deferred_degradation = (
              indexed['deferred'][last_stage]['wall_output_tok_s']
              / indexed['deferred'][stages[0]]['wall_output_tok_s']
          )
          summary = {
              'parity': parity,
              'geomean_deferred_vs_control': speedup,
              'control_stage0_to_last_ratio': control_degradation,
              'deferred_stage0_to_last_ratio': deferred_degradation,
              'rows': rows,
              'raw': data,
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )

          lines = [
              '# Deferred compact GDN decode-state A/B',
              '',
              f'- Output parity: **{parity}**',
              f'- Geometric-mean speedup vs cache-on control: **{speedup:.3f}x**',
              f'- Control stage-0 → stage-{last_stage} retention: **{control_degradation:.3f}x**',
              f'- Deferred stage-0 → stage-{last_stage} retention: **{deferred_degradation:.3f}x**',
              '',
              '| Retained prompts | Cache-off tok/s | Cache-on control | Deferred | vs control | Control/off | Deferred/off | Control decode | Deferred decode |',
              '|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for row in rows:
              lines.append(
                  f"| {row['stage']} | {row['cache_off_output_tok_s']:.3f} | "
                  f"{row['control_output_tok_s']:.3f} | {row['deferred_output_tok_s']:.3f} | "
                  f"{row['deferred_vs_control']:.3f}x | {row['control_vs_cache_off']:.3f}x | "
                  f"{row['deferred_vs_cache_off']:.3f}x | "
                  f"{(row['control_decode_tok_s'] or 0):.3f} | "
                  f"{(row['deferred_decode_tok_s'] or 0):.3f} |"
              )
          report = '\n'.join(lines) + '\n'
          (root / 'summary.md').write_text(report)
          print(report)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write(report)
          if not parity:
              raise SystemExit('deferred GDN state changed deterministic output')
          PY

      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdn-deferred-decode-state-ab
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn
