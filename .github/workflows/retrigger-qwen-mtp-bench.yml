name: Wire Qwen MTP benchmark triggers

on:
  push:
    branches: [pr/610-05-paged-qwen-mtp-prefix]
    paths: [.github/workflows/retrigger-qwen-mtp-bench.yml]

permissions:
  contents: write

jobs:
  wire-and-trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add implementation paths and self-clean
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/qwen-mtp-serving-bench.yml')
          text = path.read_text()
          old = '    paths: [.github/workflows/qwen-mtp-serving-bench.yml]\n'
          new = '''    paths:\n      - .github/workflows/qwen-mtp-serving-bench.yml\n      - vllm_metal/v1/proposer.py\n      - vllm_metal/v1/qwen_mtp_paged.py\n      - vllm_metal/attention/runtime/hybrid.py\n'''
          if old not in text:
              raise SystemExit('benchmark trigger line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/retrigger-qwen-mtp-bench.yml
          git config user.name 'Philip John Basile'
          git config user.email 'PBasile@Basilecom.com'
          git add -A
          git commit -m 'ci: benchmark Qwen MTP implementation changes'
          git push origin HEAD:pr/610-05-paged-qwen-mtp-prefix
