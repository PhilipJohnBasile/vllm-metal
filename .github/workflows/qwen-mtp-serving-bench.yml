name: Qwen MTP Serving Benchmark

on:
  push:
    branches: [pr/610-05-paged-qwen-mtp-prefix]
    paths: [.github/workflows/qwen-mtp-serving-bench.yml]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: macos-15-arm64
    timeout-minutes: 60
    env:
      VLLM_METAL_USE_PAGED_ATTENTION: "1"
      VLLM_METAL_MEMORY_FRACTION: "auto"
      MODEL_DIR: /tmp/Qwen3.5-0.8B-4bit-mtp
      BENCH_REQUESTS: "20"
      BENCH_OUTPUT_TOKENS: "128"
      BENCH_PROMPT_TOKENS: "512"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and build
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip uv
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install 'https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl'
          VLLM_METAL_BUILD_FROM_SOURCE=1 python -m pip install -e '.[dev]'
          python -m pip install --force-reinstall --no-deps 'git+https://github.com/PhilipJohnBasile/mlx-lm@ac6aaffd8fdfb8c8e713e17f155d83e3d72b0a0f'
          source scripts/lib.sh
          ensure_metal_toolchain
          build_native_artifacts
          python -c 'import torch; print("MPS available:", torch.backends.mps.is_available()); assert torch.backends.mps.is_available()'

      - name: Convert Qwen3.5-0.8B and verify MTP
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          python -m mlx_lm.convert --hf-path Qwen/Qwen3.5-0.8B --mlx-path "$MODEL_DIR" -q --q-bits 4 --q-group-size 64
          python - <<'PY'
          import os
          from mlx_lm.utils import load
          model, _ = load(os.environ['MODEL_DIR'])
          print('supports_mtp:', getattr(model, 'supports_mtp', None))
          print('mtp_layers:', len(getattr(getattr(model, 'mtp', None), 'layers', [])))
          assert bool(getattr(model, 'supports_mtp', False))
          assert len(model.make_mtp_cache()) > 0
          PY

      - name: Create benchmark client
        shell: bash
        run: |
          cat >/tmp/run_serving_bench.py <<'PY'
          import argparse, asyncio, json, statistics, time
          from pathlib import Path
          import aiohttp
          from transformers import AutoTokenizer
          from vllm.benchmarks.lib.endpoint_request_func import RequestFuncInput, async_request_openai_completions
          from vllm.benchmarks.serve import fetch_spec_decode_metrics

          async def main():
              p = argparse.ArgumentParser()
              p.add_argument('--label', required=True)
              p.add_argument('--model-dir', required=True)
              p.add_argument('--requests', type=int, required=True)
              p.add_argument('--prompt-tokens', type=int, required=True)
              p.add_argument('--output-tokens', type=int, required=True)
              p.add_argument('--result', required=True)
              a = p.parse_args()
              base = 'http://127.0.0.1:8000'
              async with aiohttp.ClientSession() as s:
                  async with s.get(base + '/v1/models') as r:
                      r.raise_for_status()
                      model = (await r.json())['data'][0]['id']
                  tok = AutoTokenizer.from_pretrained(a.model_dir, trust_remote_code=True)
                  seed = 'Apple Silicon speculative decoding uses a shared cached prefix and a trained multi-token prediction head. '
                  text = seed
                  while len(tok.encode(text, add_special_tokens=False)) < a.prompt_tokens + 16:
                      text += seed
                  prompt = tok.decode(tok.encode(text, add_special_tokens=False)[:a.prompt_tokens], skip_special_tokens=False)
                  plen = len(tok.encode(prompt, add_special_tokens=False))
                  async def one():
                      x = RequestFuncInput(prompt=prompt, api_url=base + '/v1/completions', prompt_len=plen, output_len=a.output_tokens, model=model, ignore_eos=True, extra_body={'temperature': 0})
                      y = await async_request_openai_completions(x, s)
                      if not y.success:
                          raise RuntimeError(y.error)
                      return y
                  warm = await one()
                  print('warmup_ttft_ms=', warm.ttft * 1000)
                  before = await fetch_spec_decode_metrics(base, s)
                  start = time.perf_counter()
                  outs = [await one() for _ in range(a.requests)]
                  elapsed = time.perf_counter() - start
                  after = await fetch_spec_decode_metrics(base, s)
                  tin = sum(x.prompt_len for x in outs)
                  tout = sum(x.output_tokens for x in outs)
                  drafts = accepted = 0
                  rate = None
                  if before is not None and after is not None:
                      drafts = after.num_draft_tokens - before.num_draft_tokens
                      accepted = after.num_accepted_tokens - before.num_accepted_tokens
                      rate = accepted / drafts if drafts else None
                  result = {
                      'label': a.label,
                      'requests': a.requests,
                      'prompt_tokens_per_request': plen,
                      'output_tokens_per_request': tout / a.requests,
                      'elapsed_s': elapsed,
                      'output_throughput_tok_s': tout / elapsed,
                      'total_token_throughput_tok_s': (tin + tout) / elapsed,
                      'mean_ttft_ms': statistics.mean(x.ttft * 1000 for x in outs),
                      'median_ttft_ms': statistics.median(x.ttft * 1000 for x in outs),
                      'mean_e2e_ms': statistics.mean(x.latency * 1000 for x in outs),
                      'mtp_draft_tokens': drafts,
                      'mtp_accepted_tokens': accepted,
                      'mtp_acceptance_rate': rate,
                  }
                  Path(a.result).write_text(json.dumps(result, indent=2) + '\n')
                  print('BENCHMARK_RESULT=' + json.dumps(result, sort_keys=True))
          asyncio.run(main())
          PY

      - name: Run baseline and MTP serving benchmarks
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          wait_ready() {
            for i in $(seq 1 180); do
              curl -fsS http://127.0.0.1:8000/v1/models >/dev/null 2>&1 && return 0
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$SERVER_LOG"; return 1; fi
              sleep 2
            done
            cat "$SERVER_LOG"; return 1
          }
          run_case() {
            label="$1"; spec="$2"; SERVER_LOG="/tmp/server-${label}.log"
            if [ -n "$spec" ]; then
              vllm serve "$MODEL_DIR" --served-model-name qwen35-mtp-bench --enable-prefix-caching --max-model-len 2048 --speculative-config "$spec" --port 8000 >"$SERVER_LOG" 2>&1 &
            else
              vllm serve "$MODEL_DIR" --served-model-name qwen35-mtp-bench --enable-prefix-caching --max-model-len 2048 --port 8000 >"$SERVER_LOG" 2>&1 &
            fi
            SERVER_PID=$!; wait_ready
            python /tmp/run_serving_bench.py --label "$label" --model-dir "$MODEL_DIR" --requests "$BENCH_REQUESTS" --prompt-tokens "$BENCH_PROMPT_TOKENS" --output-tokens "$BENCH_OUTPUT_TOKENS" --result "/tmp/${label}.json"
            kill "$SERVER_PID" || true; wait "$SERVER_PID" || true
            cat "$SERVER_LOG"
          }
          run_case baseline ''
          run_case mtp '{"method":"mtp","num_speculative_tokens":1}'
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('/tmp/baseline.json').read_text()); m=json.loads(Path('/tmp/mtp.json').read_text())
          s={'baseline':b,'mtp':m,'output_speedup':m['output_throughput_tok_s']/b['output_throughput_tok_s'],'total_token_speedup':m['total_token_throughput_tok_s']/b['total_token_throughput_tok_s'],'ttft_ratio':m['mean_ttft_ms']/b['mean_ttft_ms']}
          Path('/tmp/summary.json').write_text(json.dumps(s,indent=2)+'\n')
          print('FINAL_BENCHMARK_SUMMARY='+json.dumps(s,sort_keys=True))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-mtp-serving-benchmark
          path: |
            /tmp/baseline.json
            /tmp/mtp.json
            /tmp/summary.json
            /tmp/server-baseline.log
            /tmp/server-mtp.log
          if-no-files-found: warn
