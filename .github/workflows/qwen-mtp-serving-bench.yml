name: Qwen MTP Serving Benchmark

on:
  push:
    branches: [pr/610-05-paged-qwen-mtp-prefix]
    paths: [.github/workflows/qwen-mtp-serving-bench.yml]

permissions:
  contents: read

concurrency:
  group: qwen-mtp-serving-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      VLLM_METAL_USE_PAGED_ATTENTION: "1"
      VLLM_METAL_MEMORY_FRACTION: "auto"
      GLOO_SOCKET_IFNAME: lo0
      MODEL_DIR: /tmp/Qwen3.5-0.8B-4bit-mtp
      BENCH_REQUESTS: "8"
      BENCH_OUTPUT_TOKENS: "64"
      # Hybrid Qwen3.5 uses a 544-token aligned cache block on this shape.
      # 640 tokens guarantees at least one complete reusable prefix block.
      BENCH_PROMPT_TOKENS: "640"
      BENCH_REQUEST_TIMEOUT_S: "120"
      SERVER_READY_TIMEOUT_S: "720"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and build
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip uv
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install 'https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl'
          VLLM_METAL_BUILD_FROM_SOURCE=1 python -m pip install -e '.[dev]'
          python -m pip install --force-reinstall --no-deps 'git+https://github.com/PhilipJohnBasile/mlx-lm@ac6aaffd8fdfb8c8e713e17f155d83e3d72b0a0f'
          source scripts/lib.sh
          ensure_metal_toolchain
          build_native_artifacts
          python -c 'import torch; assert torch.backends.mps.is_available(); print("MPS available")'

      - name: Convert Qwen3.5-0.8B and verify MTP
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          rm -rf "$MODEL_DIR"
          python -m mlx_lm.convert --hf-path Qwen/Qwen3.5-0.8B --mlx-path "$MODEL_DIR" -q --q-bits 4 --q-group-size 64
          python - <<'PY'
          import os
          from mlx_lm.utils import load
          model, _ = load(os.environ['MODEL_DIR'])
          cache = model.make_mtp_cache()
          print('supports_mtp:', getattr(model, 'supports_mtp', None))
          print('mtp_cache_entries:', len(cache))
          assert bool(getattr(model, 'supports_mtp', False))
          assert cache
          PY

      - name: Create benchmark client
        shell: bash
        run: |
          cat >/tmp/run_serving_bench.py <<'PY'
          import argparse, asyncio, json, statistics, time
          from pathlib import Path
          import aiohttp
          from transformers import AutoTokenizer
          from vllm.benchmarks.lib.endpoint_request_func import RequestFuncInput, async_request_openai_completions
          from vllm.benchmarks.serve import fetch_spec_decode_metrics

          async def main():
              p = argparse.ArgumentParser()
              for name in ('label', 'model-dir', 'result'):
                  p.add_argument('--' + name, required=True)
              for name in ('requests', 'prompt-tokens', 'output-tokens', 'port'):
                  p.add_argument('--' + name, type=int, required=True)
              p.add_argument('--request-timeout-s', type=float, required=True)
              a = p.parse_args()
              base = f'http://127.0.0.1:{a.port}'

              async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=a.request_timeout_s)) as session:
                  async with session.get(base + '/v1/models') as r:
                      r.raise_for_status()
                      model = (await r.json())['data'][0]['id']

                  tok = AutoTokenizer.from_pretrained(a.model_dir, trust_remote_code=True)
                  seed = 'Apple Silicon speculative decoding uses a shared cached prefix and a trained multi-token prediction head. '
                  text = seed
                  while len(tok.encode(text, add_special_tokens=False)) < a.prompt_tokens + 16:
                      text += seed
                  ids = tok.encode(text, add_special_tokens=False)[:a.prompt_tokens]
                  prompt = tok.decode(ids, skip_special_tokens=False)
                  prompt_len = len(tok.encode(prompt, add_special_tokens=False))
                  print(f'{a.label} prompt_tokens={prompt_len}', flush=True)

                  async def one(tag):
                      req = RequestFuncInput(
                          prompt=prompt,
                          api_url=base + '/v1/completions',
                          prompt_len=prompt_len,
                          output_len=a.output_tokens,
                          model=model,
                          ignore_eos=True,
                          extra_body={'temperature': 0},
                      )
                      started = time.perf_counter()
                      try:
                          out = await asyncio.wait_for(
                              async_request_openai_completions(req, session),
                              timeout=a.request_timeout_s,
                          )
                      except TimeoutError as exc:
                          raise RuntimeError(f'{a.label} request {tag} timed out') from exc
                      if not out.success:
                          raise RuntimeError(f'{a.label} request {tag} failed: {out.error}')
                      print(
                          f'{a.label} {tag}: out={out.output_tokens} '
                          f'ttft_ms={out.ttft*1000:.2f} e2e_s={time.perf_counter()-started:.2f}',
                          flush=True,
                      )
                      return out

                  await one('warmup')
                  before = await fetch_spec_decode_metrics(base, session)
                  outputs = []
                  started = time.perf_counter()
                  for i in range(a.requests):
                      outputs.append(await one(f'{i+1}/{a.requests}'))
                  elapsed = time.perf_counter() - started
                  after = await fetch_spec_decode_metrics(base, session)

                  total_in = sum(x.prompt_len for x in outputs)
                  total_out = sum(x.output_tokens for x in outputs)
                  drafts = accepted = 0
                  if before is not None and after is not None:
                      drafts = after.num_draft_tokens - before.num_draft_tokens
                      accepted = after.num_accepted_tokens - before.num_accepted_tokens

                  result = {
                      'label': a.label,
                      'requests': a.requests,
                      'prompt_tokens_per_request': prompt_len,
                      'output_tokens_per_request': a.output_tokens,
                      'completed_output_tokens': total_out,
                      'elapsed_s': elapsed,
                      'output_throughput_tok_s': total_out / elapsed,
                      'total_token_throughput_tok_s': (total_in + total_out) / elapsed,
                      'mean_ttft_ms': statistics.mean(x.ttft * 1000 for x in outputs),
                      'median_ttft_ms': statistics.median(x.ttft * 1000 for x in outputs),
                      'mean_e2e_ms': statistics.mean(x.latency * 1000 for x in outputs),
                      'mtp_draft_tokens': drafts,
                      'mtp_accepted_tokens': accepted,
                      'mtp_acceptance_rate': accepted / drafts if drafts else None,
                  }
                  Path(a.result).write_text(json.dumps(result, indent=2) + '\n')
                  print('BENCHMARK_RESULT=' + json.dumps(result, sort_keys=True), flush=True)

          asyncio.run(main())
          PY

      - name: Run baseline and MTP serving benchmarks
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          SERVER_PID=""
          SERVER_LOG=""

          stop_server() {
            [ -z "${SERVER_PID:-}" ] && return 0
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -TERM "$SERVER_PID" 2>/dev/null || true
              pkill -TERM -P "$SERVER_PID" 2>/dev/null || true
              for _ in $(seq 1 15); do
                kill -0 "$SERVER_PID" 2>/dev/null || break
                sleep 1
              done
            fi
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              pkill -KILL -P "$SERVER_PID" 2>/dev/null || true
              kill -KILL "$SERVER_PID" 2>/dev/null || true
            fi
            wait "$SERVER_PID" 2>/dev/null || true
            SERVER_PID=""
          }
          trap stop_server EXIT INT TERM

          wait_ready() {
            local port="$1" start="$SECONDS" deadline=$((SECONDS + SERVER_READY_TIMEOUT_S))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if curl --connect-timeout 1 --max-time 1 -fsS "http://127.0.0.1:${port}/v1/models" >/dev/null 2>&1; then
                echo "Server ${port} ready in $((SECONDS-start))s"
                return 0
              fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                cat "$SERVER_LOG"
                return 1
              fi
              sleep 2
            done
            cat "$SERVER_LOG"
            return 1
          }

          run_case() {
            local label="$1" spec="$2" port="$3"
            SERVER_LOG="/tmp/server-${label}.log"
            # Keep scheduler mode identical across A/B. Metal MTP requires
            # synchronous scheduling for draft handoff to the scheduler.
            common=(
              "$MODEL_DIR"
              --served-model-name qwen35-mtp-bench
              --enable-prefix-caching
              --no-async-scheduling
              --max-model-len 768
              --max-num-batched-tokens 128
              --block-size 16
              --enforce-eager
              --port "$port"
            )
            if [ -n "$spec" ]; then
              vllm serve "${common[@]}" --speculative-config "$spec" >"$SERVER_LOG" 2>&1 &
            else
              vllm serve "${common[@]}" >"$SERVER_LOG" 2>&1 &
            fi
            SERVER_PID=$!
            wait_ready "$port"

            set +e
            python /tmp/run_serving_bench.py \
              --label "$label" --model-dir "$MODEL_DIR" \
              --requests "$BENCH_REQUESTS" --prompt-tokens "$BENCH_PROMPT_TOKENS" \
              --output-tokens "$BENCH_OUTPUT_TOKENS" --request-timeout-s "$BENCH_REQUEST_TIMEOUT_S" \
              --port "$port" --result "/tmp/${label}.json"
            status=$?
            set -e
            stop_server
            echo "===== ${label} server log tail ====="
            tail -n 250 "$SERVER_LOG" || true
            return "$status"
          }

          run_case baseline '' 8000
          run_case mtp '{"method":"mtp","num_speculative_tokens":1}' 8001

          python - <<'PY'
          import json
          from pathlib import Path
          b = json.loads(Path('/tmp/baseline.json').read_text())
          m = json.loads(Path('/tmp/mtp.json').read_text())
          s = {
              'baseline': b,
              'mtp': m,
              'output_speedup': m['output_throughput_tok_s'] / b['output_throughput_tok_s'],
              'total_token_speedup': m['total_token_throughput_tok_s'] / b['total_token_throughput_tok_s'],
              'ttft_ratio': m['mean_ttft_ms'] / b['mean_ttft_ms'],
          }
          Path('/tmp/summary.json').write_text(json.dumps(s, indent=2) + '\n')
          print('FINAL_BENCHMARK_SUMMARY=' + json.dumps(s, sort_keys=True), flush=True)
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-mtp-serving-benchmark
          path: |
            /tmp/baseline.json
            /tmp/mtp.json
            /tmp/summary.json
            /tmp/server-baseline.log
            /tmp/server-mtp.log
          if-no-files-found: warn
