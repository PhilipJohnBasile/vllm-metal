name: Fix AX Qwen3.6 sidecar loader alias

on:
  push:
    branches:
      - bench/m5max-qwen36-final-qualification
    paths:
      - .github/workflows/fix-ax-loader-alias.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Patch loader-visible sidecar alias
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("scripts/adopt_ax_qwen36_mtp_sidecar.py")
          source = path.read_text()
          source = replace_once(
              source,
              '''files, validates the exact 15-tensor native-MTP contract, and atomically writes
          an index that admits the sidecar.
          ''',
              '''files, validates the exact 15-tensor native-MTP contract, exposes the verified
          sidecar under MLX-LM's ``model*.safetensors`` discovery rule, and atomically
          writes a matching index.
          ''',
              "docstring",
          )
          source = replace_once(
              source,
              '''MLX_LM_MTP_HEAD = "a9fd7ef1032419a584ead9a38bdb66635f2d85c3"
          ''',
              '''MLX_LM_MTP_HEAD = "a9fd7ef1032419a584ead9a38bdb66635f2d85c3"
          LOADER_SIDECAR_NAME = "model-mtp.safetensors"
          ''',
              "loader alias constant",
          )
          source = replace_once(
              source,
              '''        methods = mirror_source(source_dir, stage_dir, link_mode)
                  index_path = stage_dir / "model.safetensors.index.json"
          ''',
              '''        methods = mirror_source(source_dir, stage_dir, link_mode)
                  loader_sidecar_path = stage_dir / LOADER_SIDECAR_NAME
                  if loader_sidecar_path.exists():
                      raise RuntimeError(
                          f"loader sidecar alias already exists: {loader_sidecar_path}"
                      )
                  alias_method = materialize_file(
                      source_dir / "mtp.safetensors",
                      loader_sidecar_path,
                      link_mode,
                  )
                  methods[f"{alias_method}-mtp-loader-alias"] += 1

                  index_path = stage_dir / "model.safetensors.index.json"
          ''',
              "alias materialization",
          )
          source = replace_once(
              source,
              '''        for key in sorted(EXPECTED_TENSORS):
                      weight_map[key] = "mtp.safetensors"
          ''',
              '''        for key in sorted(EXPECTED_TENSORS):
                      weight_map[key] = LOADER_SIDECAR_NAME
          ''',
              "index mapping",
          )
          source = replace_once(
              source,
              '''            "sidecar_sha256": source_contract["sidecar_sha256"],
                      "sidecar_file_bytes": source_contract["sidecar_file_bytes"],
          ''',
              '''            "sidecar_sha256": source_contract["sidecar_sha256"],
                      "loader_sidecar_name": LOADER_SIDECAR_NAME,
                      "sidecar_file_bytes": source_contract["sidecar_file_bytes"],
          ''',
              "receipt alias",
          )
          source = replace_once(
              source,
              '''        if any(staged_map.get(key) != "mtp.safetensors" for key in EXPECTED_TENSORS):
                      raise RuntimeError("staged index failed its MTP mapping verification")
                  if sha256_file(stage_dir / "mtp.safetensors") != receipt["sidecar_sha256"]:
                      raise RuntimeError("staged sidecar digest changed during materialization")
          ''',
              '''        if any(
                      staged_map.get(key) != LOADER_SIDECAR_NAME
                      for key in EXPECTED_TENSORS
                  ):
                      raise RuntimeError("staged index failed its MTP mapping verification")
                  if sha256_file(loader_sidecar_path) != receipt["sidecar_sha256"]:
                      raise RuntimeError("loader-visible sidecar digest changed")
          ''',
              "staged verification",
          )
          path.write_text(source)

          docs_path = Path("benchmarks/M5MAX_QWEN36_QUALIFICATION.md")
          docs = docs_path.read_text()
          marker = '''The sidecar has now been independently inspected: its 15 BF16 tensors use the
          exact native `mlx-lm#1740` names, dtypes, shapes, and contiguous byte spans. The
          preferred fast path is therefore a fail-closed index adoption, not a tensor rewrite.
          The adopter verifies the AX provenance manifest and full sidecar SHA-256 before it
          creates a separate model directory. Official conversion remains the clean fallback.
          '''
          replacement = '''The sidecar has now been independently inspected: its 15 BF16 tensors use the
          exact native `mlx-lm#1740` names, dtypes, shapes, and contiguous byte spans. The
          preferred fast path is therefore a fail-closed adoption, not a tensor rewrite.
          MLX-LM discovers local weights with `model*.safetensors`, so the adopter exposes the
          verified bytes as `model-mtp.safetensors`, writes a matching index, and records the
          alias in `native_mtp_adoption.json`. It verifies the AX provenance manifest and full
          sidecar SHA-256 before the separate model directory becomes visible. Official
          conversion remains the clean fallback.
          '''
          docs_path.write_text(replace_once(docs, marker, replacement, "documentation"))
          PY

      - name: Validate loader discovery and adoption contract
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install 'ruff==0.16.0'
          ruff check --fix scripts/adopt_ax_qwen36_mtp_sidecar.py
          ruff format scripts/adopt_ax_qwen36_mtp_sidecar.py
          ruff check scripts/adopt_ax_qwen36_mtp_sidecar.py
          ruff format --check scripts/adopt_ax_qwen36_mtp_sidecar.py
          python -m py_compile scripts/adopt_ax_qwen36_mtp_sidecar.py
          bash -n scripts/run_m5max_qwen36_qualification.sh
          python - <<'PY'
          from __future__ import annotations

          import glob
          import importlib.util
          import json
          import math
          import struct
          import tempfile
          from pathlib import Path

          module_path = Path("scripts/adopt_ax_qwen36_mtp_sidecar.py").resolve()
          spec = importlib.util.spec_from_file_location("adopter", module_path)
          assert spec and spec.loader
          adopter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(adopter)

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              source = root / "source"
              output = root / "output"
              source.mkdir()
              config = {
                  "model_type": "qwen3_5",
                  "mtp_num_hidden_layers": 1,
                  "quantization": {"bits": 6, "group_size": 64, "mode": "affine"},
                  "text_config": {
                      "hidden_size": 5120,
                      "intermediate_size": 17408,
                      "num_hidden_layers": 64,
                      "mtp_num_hidden_layers": 1,
                  },
              }
              (source / "config.json").write_text(json.dumps(config))
              index = {
                  "metadata": {"total_size": 1},
                  "weight_map": {
                      "language_model.lm_head.weight": "model-00001-of-00001.safetensors"
                  },
              }
              (source / "model.safetensors.index.json").write_text(json.dumps(index))
              (source / "model-00001-of-00001.safetensors").write_bytes(b"x")

              header = {}
              offset = 0
              for key, (dtype, shape) in adopter.EXPECTED_TENSORS.items():
                  size = math.prod(shape) * 2
                  header[key] = {
                      "dtype": dtype,
                      "shape": list(shape),
                      "data_offsets": [offset, offset + size],
                  }
                  offset += size
              payload = json.dumps(header, separators=(",", ":")).encode()
              sidecar = source / "mtp.safetensors"
              with sidecar.open("wb") as handle:
                  handle.write(struct.pack("<Q", len(payload)))
                  handle.write(payload)
                  handle.seek(8 + len(payload) + offset - 1)
                  handle.write(b"\0")
              manifest = {
                  "output": {
                      "mtp": {
                          "path": "mtp.safetensors",
                          "size_bytes": sidecar.stat().st_size,
                          "sha256": "synthetic-sidecar-sha",
                      }
                  }
              }
              (source / "ax_mtp_sidecar_manifest.json").write_text(json.dumps(manifest))

              real_sha = adopter.sha256_file

              def synthetic_sha(path):
                  path = Path(path)
                  if path.name in {"mtp.safetensors", adopter.LOADER_SIDECAR_NAME}:
                      return "synthetic-sidecar-sha"
                  return real_sha(path)

              adopter.sha256_file = synthetic_sha
              receipt = adopter.build_adopted_model(source, output, "hardlink")
              adopted_index = json.loads(
                  (output / "model.safetensors.index.json").read_text()
              )
              alias = output / adopter.LOADER_SIDECAR_NAME
              discovered = {Path(path).name for path in glob.glob(str(output / "model*.safetensors"))}
              assert adopter.LOADER_SIDECAR_NAME in discovered
              assert receipt["loader_sidecar_name"] == adopter.LOADER_SIDECAR_NAME
              assert all(
                  adopted_index["weight_map"][key] == adopter.LOADER_SIDECAR_NAME
                  for key in adopter.EXPECTED_TENSORS
              )
              assert alias.is_file()
              assert alias.stat().st_ino == sidecar.stat().st_ino
              assert (output / "mtp.safetensors").is_file()
              assert adopted_index["metadata"]["total_size"] == 1 + offset
          print("MLX-LM model*.safetensors discovery contract passed")
          PY
          git diff --check

      - name: Commit source repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/adopt_ax_qwen36_mtp_sidecar.py \
            benchmarks/M5MAX_QWEN36_QUALIFICATION.md
          git commit -m 'bench: expose AX MTP sidecar to MLX-LM loader'
          git push origin HEAD:bench/m5max-qwen36-final-qualification
