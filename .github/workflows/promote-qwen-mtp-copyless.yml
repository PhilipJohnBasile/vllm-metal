name: Promote Qwen MTP Copyless GDN State

on:
  push:
    branches: [perf/qwen-mtp-copyless-promotion]
    paths:
      - .github/workflows/promote-qwen-mtp-copyless.yml
      - benchmarks/patches/qwen_mtp_copyless_gdn.patch

permissions:
  contents: write

concurrency:
  group: promote-qwen-mtp-copyless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install source stack
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip uv
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install \
            'https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl'
          VLLM_METAL_BUILD_FROM_SOURCE=1 python -m pip install -e '.[dev]'
          python -m pip install --force-reinstall --no-deps \
            'git+https://github.com/PhilipJohnBasile/mlx-lm@ac6aaffd8fdfb8c8e713e17f155d83e3d72b0a0f'
          source scripts/lib.sh
          ensure_metal_toolchain
          build_native_artifacts

      - name: Apply and format copyless destination-state patch
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          git apply --check --whitespace=nowarn \
            benchmarks/patches/qwen_mtp_copyless_gdn.patch
          git apply --whitespace=nowarn \
            benchmarks/patches/qwen_mtp_copyless_gdn.patch
          ruff format \
            vllm_metal/attention/impls/gdn_lazy.py \
            vllm_metal/attention/impls/linear.py
          python -m py_compile \
            vllm_metal/attention/impls/gdn_lazy.py \
            vllm_metal/attention/impls/linear.py
          git diff --check

      - name: Run focused correctness gate
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          pytest -q \
            tests/test_gdn_lazy_wrapper.py \
            tests/attention/test_align_gdn_state_manager.py \
            tests/test_qwen_native_mtp_proposer.py \
            tests/test_qwen_mtp_paged_cache.py \
            2>&1 | tee /tmp/copyless-focused-tests.log
          ruff check \
            vllm_metal/attention/impls/gdn_lazy.py \
            vllm_metal/attention/impls/linear.py
          ruff format --check \
            vllm_metal/attention/impls/gdn_lazy.py \
            vllm_metal/attention/impls/linear.py

      - name: Commit validated production change
        shell: bash
        run: |
          set -euxo pipefail
          git rm \
            .github/workflows/promote-qwen-mtp-copyless.yml \
            benchmarks/patches/qwen_mtp_copyless_gdn.patch
          git add \
            vllm_metal/attention/impls/gdn_lazy.py \
            vllm_metal/attention/impls/linear.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Optimize speculative GDN state writes'
          git push origin HEAD:perf/qwen-mtp-copyless-promotion

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Qwen MTP copyless GDN promotion'
            echo
            echo '- Applied direct source-to-destination speculative GDN writes.'
            echo '- Focused correctness tests, Ruff, formatting, and diff checks passed before commit.'
            echo '- The bootstrap workflow and patch file were removed from the promoted tree.'
          } >> "$GITHUB_STEP_SUMMARY"
