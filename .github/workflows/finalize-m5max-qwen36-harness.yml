name: Finalize M5 Max Qwen3.6 qualification harness

on:
  push:
    branches:
      - bench/m5max-qwen36-final-qualification
    paths:
      - .github/workflows/finalize-m5max-qwen36-harness.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Format, lint, and validate
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install 'ruff==0.16.0'
          ruff check --fix benchmarks/qwen_mtp_m5max_qualification.py
          ruff format benchmarks/qwen_mtp_m5max_qualification.py
          ruff check benchmarks/qwen_mtp_m5max_qualification.py
          ruff format --check benchmarks/qwen_mtp_m5max_qualification.py
          python -m py_compile benchmarks/qwen_mtp_m5max_qualification.py
          bash -n scripts/run_m5max_qwen36_qualification.sh
          git diff --check

      - name: Commit final files and remove workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/finalize-m5max-qwen36-harness.yml
          git add benchmarks/qwen_mtp_m5max_qualification.py \
            scripts/run_m5max_qwen36_qualification.sh \
            benchmarks/M5MAX_QWEN36_QUALIFICATION.md \
            .github/workflows/finalize-m5max-qwen36-harness.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'bench: finalize physical M5 Max Qwen3.6 qualification harness'
          git push origin HEAD:bench/m5max-qwen36-final-qualification
