name: Qwen MTP Copyless State Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - bench/qwen-mtp-copyless-state
    paths:
      - .github/workflows/qwen-mtp-copyless-state-bench.yml
      - benchmarks/apply_copyless_gdn_state.py
      - benchmarks/qwen_mtp_copyless_ab.py

permissions:
  contents: read

concurrency:
  group: qwen-mtp-copyless-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MODEL_DIR: /Users/runner/.cache/vllm-metal-bench/Qwen3.5-0.8B-4bit-mtp
      RESULT_DIR: /tmp/qwen-mtp-copyless-state
      MLX_LM_REF: ac6aaffd8fdfb8c8e713e17f155d83e3d72b0a0f
      GLOO_SOCKET_IFNAME: lo0
      VLLM_METAL_USE_PAGED_ATTENTION: "1"
      VLLM_METAL_MEMORY_FRACTION: auto

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache converted benchmark model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: qwen35-08b-4bit-mtp-${{ runner.os }}-${{ runner.arch }}-${{ env.MLX_LM_REF }}

      - name: Install vLLM Metal and exact mlx-lm MTP head
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip uv
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install \
            'https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl'
          VLLM_METAL_BUILD_FROM_SOURCE=1 python -m pip install -e '.[dev]'
          python -m pip install --force-reinstall --no-deps \
            "git+https://github.com/PhilipJohnBasile/mlx-lm@${MLX_LM_REF}"
          source scripts/lib.sh
          ensure_metal_toolchain
          build_native_artifacts
          python -c 'import torch; assert torch.backends.mps.is_available()'

      - name: Convert Qwen3.5-0.8B with MTP weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          rm -rf "$MODEL_DIR"
          mkdir -p "$(dirname "$MODEL_DIR")"
          python -m mlx_lm.convert \
            --hf-path Qwen/Qwen3.5-0.8B \
            --mlx-path "$MODEL_DIR" \
            -q --q-bits 4 --q-group-size 64

      - name: Run copyless state A/B
        id: ab
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          rm -rf "$RESULT_DIR"
          python benchmarks/qwen_mtp_copyless_ab.py \
            --model-dir "$MODEL_DIR" \
            --output-dir "$RESULT_DIR" \
            2>&1 | tee /tmp/qwen-mtp-copyless-ab.log
          cp /tmp/qwen-mtp-copyless-ab.log "$RESULT_DIR/run.log"

      - name: Publish A/B summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RESULT_DIR/copyless-summary.md" ]; then
            cat "$RESULT_DIR/copyless-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Qwen MTP copyless GDN state A/B' >> "$GITHUB_STEP_SUMMARY"
            echo 'The experiment stopped before producing a summary.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload copyless benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-mtp-copyless-state-benchmark
          path: |
            ${{ env.RESULT_DIR }}
            /tmp/qwen-mtp-copyless-ab.log
          if-no-files-found: warn

      - name: Fail when A/B did not complete
        if: steps.ab.outcome == 'failure'
        shell: bash
        run: |
          echo 'The copyless GDN state A/B did not complete.' >&2
          exit 1
