name: Materialize validated Qwen MTP rebase

on:
  workflow_dispatch:
  pull_request:
    branches:
      - handoff-pr-618-20260822

permissions:
  contents: write

concurrency:
  group: materialize-qwen-mtp-rebase
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      INTEGRATION_BASE: 150dd3292bd940f2eac1b3442ece21355d8ebf19
      FEATURE_HEAD: 5c1250161a9de28fa5fd734d922a0df604101eb6
      UPSTREAM_MAIN: 211a1e4bc976cd6c0c961cad8da59d649ea9bd65
      TARGET_BRANCH: rehearsal-pr-618-on-main-211a1e4-20260822-r1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild the guarded two-commit rebase
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git remote add canonical https://github.com/vllm-project/vllm-metal.git
          git fetch --no-tags canonical "${UPSTREAM_MAIN}"
          cp tools/resolve_qwen_mtp_rebase_conflicts.py /tmp/resolve.py
          git switch --detach "${FEATURE_HEAD}"

          set +e
          git rebase --onto "${UPSTREAM_MAIN}" "${INTEGRATION_BASE}" "${FEATURE_HEAD}"
          rc=$?
          set -e
          test "${rc}" -ne 0

          python /tmp/resolve.py
          git add \
            vllm_metal/attention/impls/gdn_lazy.py \
            vllm_metal/v1/cache_policy.py
          GIT_EDITOR=true git rebase --continue

          test "$(git rev-list --count "${UPSTREAM_MAIN}..HEAD")" -eq 2
          git diff --check "${UPSTREAM_MAIN}..HEAD"
          test -z "$(git diff --name-only --diff-filter=U)"
          if git diff "${UPSTREAM_MAIN}..HEAD" \
            | grep -q -E 'state_pool\[write_slot_ids_arr\]|state_pool\[[^]]+\] = state_updates'; then
            echo "direct speculative state-pool write remains" >&2
            exit 1
          fi
          git diff "${UPSTREAM_MAIN}..HEAD" | grep -F 'write_conv_rows(' >/dev/null
          git diff "${UPSTREAM_MAIN}..HEAD" | grep -F 'write_recurrent_rows(' >/dev/null

      - name: Publish the uniquely named rehearsal branch
        shell: bash
        run: |
          set -euxo pipefail
          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}"; then
            echo "Target branch already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          {
            echo "## Published rehearsal"
            echo
            echo "- Base: \`${UPSTREAM_MAIN}\`"
            echo "- Branch: \`${TARGET_BRANCH}\`"
            echo "- Head: \`$(git rev-parse HEAD)\`"
            echo
            git log --oneline --reverse "${UPSTREAM_MAIN}..HEAD"
          } >> "${GITHUB_STEP_SUMMARY}"
