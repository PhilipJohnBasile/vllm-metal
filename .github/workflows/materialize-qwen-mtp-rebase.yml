name: Materialize validated Qwen MTP rebase

on:
  workflow_dispatch:
  pull_request:
    branches:
      - handoff-pr-618-20260822

permissions:
  contents: write

concurrency:
  group: materialize-qwen-mtp-rebase
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      INTEGRATION_BASE: 150dd3292bd940f2eac1b3442ece21355d8ebf19
      FIRST_FEATURE_COMMIT: bf59b7c4d912f3aca5f8217b0da1bfd1ed260294
      SECOND_FEATURE_COMMIT: 5c1250161a9de28fa5fd734d922a0df604101eb6
      UPSTREAM_MAIN: 211a1e4bc976cd6c0c961cad8da59d649ea9bd65
      TARGET_BRANCH: rehearsal-pr-618-on-main-211a1e4-20260822-r1
      BENCH_WORKFLOW: .github/workflows/qwen-mtp-serving-bench.yml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate the connector-preseeded target
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git remote add canonical https://github.com/vllm-project/vllm-metal.git
          git fetch --no-tags canonical "${UPSTREAM_MAIN}"
          git fetch --no-tags origin "${TARGET_BRANCH}"
          seed=$(git rev-parse "origin/${TARGET_BRANCH}")
          echo "SEED_COMMIT=${seed}" >> "${GITHUB_ENV}"
          test "$(git rev-parse "${seed}^")" = "${UPSTREAM_MAIN}"
          test "$(git diff --name-only "${UPSTREAM_MAIN}..${seed}")" = "${BENCH_WORKFLOW}"
          git cat-file -e "${FIRST_FEATURE_COMMIT}^{commit}"
          git cat-file -e "${SECOND_FEATURE_COMMIT}^{commit}"
          cp tools/resolve_qwen_mtp_rebase_conflicts.py /tmp/resolve.py
          python -m py_compile /tmp/resolve.py

      - name: Replay the two feature commits after the workflow seed
        shell: bash
        run: |
          set -euxo pipefail
          git switch --detach "${SEED_COMMIT}"

          set +e
          git cherry-pick "${FIRST_FEATURE_COMMIT}"
          first_rc=$?
          set -e
          test "${first_rc}" -ne 0

          git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
          grep -Fx 'vllm_metal/attention/impls/gdn_lazy.py' /tmp/conflicts.txt
          grep -Fx 'vllm_metal/v1/cache_policy.py' /tmp/conflicts.txt

          if grep -Fxq "${BENCH_WORKFLOW}" /tmp/conflicts.txt; then
            # The connector already installed the byte-identical workflow on
            # the target branch because Actions cannot create workflow files.
            git checkout --ours -- "${BENCH_WORKFLOW}"
            git add "${BENCH_WORKFLOW}"
          fi

          unexpected=$(grep -Fvx \
            -e 'vllm_metal/attention/impls/gdn_lazy.py' \
            -e 'vllm_metal/v1/cache_policy.py' \
            -e "${BENCH_WORKFLOW}" \
            /tmp/conflicts.txt || true)
          test -z "${unexpected}"

          python /tmp/resolve.py
          git add \
            vllm_metal/attention/impls/gdn_lazy.py \
            vllm_metal/v1/cache_policy.py
          GIT_EDITOR=true git cherry-pick --continue

          # The first feature commit must not alter the connector-preseeded
          # workflow; its code and benchmark assets remain in the same tree.
          git diff --exit-code "${SEED_COMMIT}" -- "${BENCH_WORKFLOW}"

          git cherry-pick "${SECOND_FEATURE_COMMIT}"

          test "$(git rev-list --count "${SEED_COMMIT}..HEAD")" -eq 2
          test "$(git rev-list --count "${UPSTREAM_MAIN}..HEAD")" -eq 3
          git diff --check "${UPSTREAM_MAIN}..HEAD"
          test -z "$(git diff --name-only --diff-filter=U)"

          if git diff "${UPSTREAM_MAIN}..HEAD" \
            | grep -q -E 'state_pool\[write_slot_ids_arr\]|state_pool\[[^]]+\] = state_updates'; then
            echo "direct speculative state-pool write remains" >&2
            exit 1
          fi
          git diff "${UPSTREAM_MAIN}..HEAD" | grep -F 'write_conv_rows(' >/dev/null
          git diff "${UPSTREAM_MAIN}..HEAD" | grep -F 'write_recurrent_rows(' >/dev/null

      - name: Fast-forward the uniquely named rehearsal branch
        shell: bash
        run: |
          set -euxo pipefail
          remote_tip=$(git ls-remote --heads origin "${TARGET_BRANCH}" | awk '{print $1}')
          test "${remote_tip}" = "${SEED_COMMIT}"
          git merge-base --is-ancestor "${SEED_COMMIT}" HEAD
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          {
            echo "## Published rehearsal"
            echo
            echo "- Upstream base: \`${UPSTREAM_MAIN}\`"
            echo "- Workflow seed: \`${SEED_COMMIT}\`"
            echo "- Branch: \`${TARGET_BRANCH}\`"
            echo "- Head: \`$(git rev-parse HEAD)\`"
            echo
            git log --oneline --reverse "${UPSTREAM_MAIN}..HEAD"
          } >> "${GITHUB_STEP_SUMMARY}"
