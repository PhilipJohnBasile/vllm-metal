name: Prefix Stability Contract

on:
  workflow_dispatch:
  push:
    branches: [perf/prefix-stability-contract]
    paths:
      - tools/prefix_stability.py
      - tests/test_prefix_stability_tool.py
      - docs/prefix-stability-contract.md
      - .github/workflows/prefix-stability-contract.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile and test
        run: |
          python -m py_compile tools/prefix_stability.py
          pytest -q tests/test_prefix_stability_tool.py
