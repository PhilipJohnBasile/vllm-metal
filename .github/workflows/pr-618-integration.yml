name: PR 618 integration report

on:
  push:
    branches:
      - integration/pr-618-main-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-618-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  three-way-merge:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip integration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          ref: integration/pr-618-main-20260822
          fetch-depth: 0
          persist-credentials: true

      - name: Attempt merge and capture report
        id: merge
        shell: bash
        run: |
          set -uo pipefail

          target_branch="integration/pr-618-main-20260822"
          report_dir="/tmp/pr-618-merge-report"
          rm -rf "$report_dir"
          mkdir -p "$report_dir"

          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"

          git fetch origin \
            pr/610-05-paged-qwen-mtp-prefix:refs/remotes/origin/pr-618-head

          integration_head=$(git rev-parse HEAD)
          pr_head=$(git rev-parse refs/remotes/origin/pr-618-head)
          merge_base=$(git merge-base HEAD refs/remotes/origin/pr-618-head)

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/pr-618-head \
            >"$report_dir/merge.stdout" 2>"$report_dir/merge.stderr"
          merge_status=$?
          set -e

          conflicts=$(git diff --name-only --diff-filter=U || true)
          printf '%s\n' "$conflicts" | sed '/^$/d' >"$report_dir/conflicts.txt"
          conflict_count=$(wc -l <"$report_dir/conflicts.txt" | tr -d ' ')

          git status --porcelain=v2 >"$report_dir/status-porcelain-v2.txt" || true
          git ls-files -u >"$report_dir/unmerged-index.txt" || true
          git diff --cc >"$report_dir/conflicts.diff" || true

          REPORT_DIR="$report_dir" \
          INTEGRATION_HEAD="$integration_head" \
          PR_HEAD="$pr_head" \
          MERGE_BASE="$merge_base" \
          MERGE_STATUS="$merge_status" \
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          conflicts = [
              line
              for line in (report_dir / "conflicts.txt").read_text().splitlines()
              if line
          ]
          generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          merge_status = int(os.environ["MERGE_STATUS"])

          report = {
              "schema_version": 1,
              "generated_at": generated_at,
              "integration_head": os.environ["INTEGRATION_HEAD"],
              "pr_head": os.environ["PR_HEAD"],
              "merge_base": os.environ["MERGE_BASE"],
              "merge_exit_status": merge_status,
              "conflict_count": len(conflicts),
              "conflicts": conflicts,
          }
          (report_dir / "pr_618_merge_report_20260822.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )

          lines = [
              "# PR #618 three-way integration report",
              "",
              f"Generated automatically on {generated_at}.",
              "",
              f"- Integration head before merge: `{report['integration_head']}`",
              f"- Preserved PR #618 head: `{report['pr_head']}`",
              f"- Computed merge base: `{report['merge_base']}`",
              f"- Raw merge exit status: `{merge_status}`",
              f"- Unmerged path count: **{len(conflicts)}**",
              "",
          ]
          if merge_status == 0 and not conflicts:
              lines += [
                  "## Result",
                  "",
                  "The merge completed without unresolved paths. The resulting",
                  "merge tree is committed to the integration branch.",
              ]
          else:
              lines += ["## Unresolved paths", ""]
              if conflicts:
                  lines.extend(f"- `{path}`" for path in conflicts)
              else:
                  lines += [
                      "The merge failed without leaving unmerged index entries.",
                      "See the captured stdout and stderr files.",
                  ]
              lines += [
                  "",
                  "No conflict-marker files are committed. The full combined diff,",
                  "unmerged index stages, and merge output are retained in the",
                  "`pr-618-merge-report` workflow artifact.",
              ]
          (report_dir / "pr_618_merge_report_20260822.md").write_text(
              "\n".join(lines) + "\n"
          )
          PY

          if [ "$merge_status" -eq 0 ] && [ "$conflict_count" -eq 0 ]; then
            mkdir -p docs
            cp "$report_dir/pr_618_merge_report_20260822.md" docs/
            cp "$report_dir/pr_618_merge_report_20260822.json" docs/
            git add docs/pr_618_merge_report_20260822.md \
              docs/pr_618_merge_report_20260822.json
            git commit -m "merge: integrate PR #618 onto current main

Three-way merge of the preserved #618 head after transplanting its clean files.

Signed-off-by: Philip John Basile <PBasile@Basilecom.com>"
            echo "clean=true" >>"$GITHUB_OUTPUT"
          else
            git merge --abort || true
            mkdir -p docs
            cp "$report_dir/pr_618_merge_report_20260822.md" docs/
            cp "$report_dir/pr_618_merge_report_20260822.json" docs/
            git add docs/pr_618_merge_report_20260822.md \
              docs/pr_618_merge_report_20260822.json
            git commit -m "docs: record PR #618 three-way merge conflicts [skip integration]

Generated against the exact current-main integration head and preserved PR head.

Signed-off-by: Philip John Basile <PBasile@Basilecom.com>"
            echo "clean=false" >>"$GITHUB_OUTPUT"
          fi

          git push origin HEAD:"$target_branch"

      - name: Upload exact merge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-618-merge-report
          path: /tmp/pr-618-merge-report
          if-no-files-found: warn
