name: Finalize AX Qwen3.6 sidecar adoption path

on:
  push:
    branches:
      - bench/m5max-qwen36-final-qualification
    paths:
      - .github/workflows/finalize-ax-sidecar-adoption.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wire the adopter into the runner and documentation
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          helper_path = Path("scripts/adopt_ax_qwen36_mtp_sidecar.py")
          helper = helper_path.read_text()
          helper = replace_once(
              helper,
              '''        actual_dtype = str(row.get("dtype"))
                  actual_shape = tuple(int(value) for value in row.get("shape", []))
                  if (actual_dtype, actual_shape) != (expected_dtype, expected_shape):
                      raise RuntimeError(
                          f"{key} contract mismatch: expected {(expected_dtype, expected_shape)}, "
                          f"got {(actual_dtype, actual_shape)}"
                      )
          ''',
              '''        actual_dtype = str(row.get("dtype"))
                  actual_shape = tuple(int(value) for value in row.get("shape", []))
                  if (actual_dtype, actual_shape) != (expected_dtype, expected_shape):
                      raise RuntimeError(
                          f"{key} contract mismatch: expected {(expected_dtype, expected_shape)}, "
                          f"got {(actual_dtype, actual_shape)}"
                      )
                  offsets = tuple(int(value) for value in row.get("data_offsets", []))
                  if len(offsets) != 2 or offsets[0] < 0 or offsets[1] < offsets[0]:
                      raise RuntimeError(f"{key} has invalid data_offsets: {offsets}")
                  expected_bytes = math.prod(expected_shape) * 2
                  if offsets[1] - offsets[0] != expected_bytes:
                      raise RuntimeError(
                          f"{key} byte-span mismatch: expected {expected_bytes}, "
                          f"got {offsets[1] - offsets[0]}"
                      )

              spans = sorted(
                  (
                      int(row["data_offsets"][0]),
                      int(row["data_offsets"][1]),
                      key,
                  )
                  for key, row in tensor_rows.items()
              )
              cursor = 0
              for start, end, key in spans:
                  if start != cursor:
                      raise RuntimeError(
                          f"sidecar data is not a contiguous non-overlapping slab at {key}: "
                          f"expected start {cursor}, got {start}"
                      )
                  cursor = end
              if cursor != data_bytes:
                  raise RuntimeError(
                      f"sidecar data-span mismatch: {cursor} != {data_bytes}"
                  )
          ''',
              "helper tensor-byte contract",
          )
          helper_path.write_text(helper)

          runner_path = Path("scripts/run_m5max_qwen36_qualification.sh")
          runner = runner_path.read_text()
          runner = replace_once(
              runner,
              '''PREPARE_OFFICIAL=0
          Q_BITS=6
          SKIP_INSTALL=0
          ''',
              '''PREPARE_OFFICIAL=0
          PREPARE_AX=0
          AX_SOURCE_DIR=""
          AX_REPO="AutomatosX/AX-Qwen3.6-27B-MLX-6bit-MTP"
          LINK_MODE="auto"
          Q_BITS=6
          SKIP_INSTALL=0
          ''',
              "runner variables",
          )
          runner = replace_once(
              runner,
              '''  --prepare-official        Convert Qwen/Qwen3.6-27B into MODEL_DIR first.
            --q-bits N                Quantization bits for conversion (default: 6).
          ''',
              '''  --prepare-ax              Download/reuse the AX 6-bit package and safely
                                      adopt its compatible MTP sidecar into MODEL_DIR.
            --adopt-ax-sidecar PATH   Adopt an already-downloaded AX package from PATH.
            --link-mode MODE          auto, hardlink, symlink, or copy (default: auto).
            --prepare-official        Convert Qwen/Qwen3.6-27B into MODEL_DIR first.
            --q-bits N                Quantization bits for official conversion (default: 6).
          ''',
              "runner usage",
          )
          runner = replace_once(
              runner,
              '''    --prepare-official)
                PREPARE_OFFICIAL=1
                shift
                ;;
              --q-bits)
          ''',
              '''    --prepare-ax)
                PREPARE_AX=1
                shift
                ;;
              --adopt-ax-sidecar)
                AX_SOURCE_DIR="$2"
                shift 2
                ;;
              --link-mode)
                LINK_MODE="$2"
                shift 2
                ;;
              --prepare-official)
                PREPARE_OFFICIAL=1
                shift
                ;;
              --q-bits)
          ''',
              "runner option parser",
          )
          runner = replace_once(
              runner,
              '''if [[ ! "$REPEATS" =~ ^[2-9][0-9]*$ ]]; then
            echo "--repeats must be an integer >= 2" >&2
            exit 64
          fi

          MODEL_DIR="$(python3 -c 'import os,sys; print(os.path.abspath(os.path.expanduser(sys.argv[1])))' "$MODEL_DIR")"
          ''',
              '''if [[ ! "$REPEATS" =~ ^[2-9][0-9]*$ ]]; then
            echo "--repeats must be an integer >= 2" >&2
            exit 64
          fi
          if [[ ! "$LINK_MODE" =~ ^(auto|hardlink|symlink|copy)$ ]]; then
            echo "--link-mode must be auto, hardlink, symlink, or copy" >&2
            exit 64
          fi
          preparation_modes=$((PREPARE_OFFICIAL + PREPARE_AX))
          if [[ -n "$AX_SOURCE_DIR" ]]; then
            preparation_modes=$((preparation_modes + 1))
          fi
          if ((preparation_modes > 1)); then
            echo "Choose only one of --prepare-ax, --adopt-ax-sidecar, or --prepare-official." >&2
            exit 64
          fi

          MODEL_DIR="$(python3 -c 'import os,sys; print(os.path.abspath(os.path.expanduser(sys.argv[1])))' "$MODEL_DIR")"
          ''',
              "runner validation",
          )
          runner = replace_once(
              runner,
              '''echo "MLX-LM:     $MLX_LM_MTP_SHA"
          ''',
              '''echo "MLX-LM:     $MLX_LM_MTP_SHA"
          echo "AX package:  $AX_REPO"
          ''',
              "runner display",
          )
          start = runner.index('if [[ "$PREPARE_OFFICIAL" -eq 1 ]]; then')
          end_marker = '\nif [[ ! -f "$MODEL_DIR/config.json" ]]; then'
          end = runner.index(end_marker, start)
          preparation = '''if [[ "$PREPARE_AX" -eq 1 || -n "$AX_SOURCE_DIR" ]]; then
            if [[ -e "$MODEL_DIR" ]]; then
              if [[ ! -f "$MODEL_DIR/config.json" ]]; then
                echo "Refusing to adopt into non-model path: $MODEL_DIR" >&2
                exit 2
              fi
              echo "Model directory already exists; validating it instead of adopting again."
            else
              if [[ "$PREPARE_AX" -eq 1 ]]; then
                echo "Downloading or reusing $AX_REPO from the Hugging Face cache..."
                AX_SOURCE_DIR="$(AX_REPO="$AX_REPO" python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          print(snapshot_download(repo_id=os.environ["AX_REPO"]))
          PY
          )"
              fi
              python scripts/adopt_ax_qwen36_mtp_sidecar.py \
                "$AX_SOURCE_DIR" \
                "$MODEL_DIR" \
                --link-mode "$LINK_MODE"
            fi
          elif [[ "$PREPARE_OFFICIAL" -eq 1 ]]; then
            if [[ -e "$MODEL_DIR" ]]; then
              if [[ ! -f "$MODEL_DIR/config.json" ]]; then
                echo "Refusing to convert into non-model path: $MODEL_DIR" >&2
                exit 2
              fi
              echo "Model directory already exists; validating it instead of reconverting."
            else
              parent="$(dirname "$MODEL_DIR")"
              mkdir -p "$parent"
              free_kb="$(df -Pk "$parent" | awk 'NR==2{print $4}')"
              free_gib=$((free_kb / 1024 / 1024))
              if ((free_gib < 100)); then
                echo "WARNING: only ${free_gib} GiB free. Official BF16 download plus the" >&2
                echo "6-bit output can require roughly 100 GiB of temporary/free space." >&2
              fi
              echo "Converting official Qwen/Qwen3.6-27B with native MTP tensors..."
              python -m mlx_lm.convert \
                --hf-path Qwen/Qwen3.6-27B \
                --mlx-path "$MODEL_DIR" \
                -q \
                --q-bits "$Q_BITS" \
                --q-group-size 64 \
                --dtype bfloat16
            fi
          fi
          '''
          runner = runner[:start] + preparation + runner[end:]
          runner = replace_once(
              runner,
              '''  echo "Pass --prepare-official or point --model-dir at a completed native-MTP MLX conversion." >&2
          ''',
              '''  echo "Pass --prepare-ax, --adopt-ax-sidecar, --prepare-official, or point" >&2
            echo "--model-dir at a completed native-MTP MLX model." >&2
          ''',
              "runner missing-model message",
          )
          runner = replace_once(
              runner,
              '''  echo "model_config_sha256=$(shasum -a 256 "$MODEL_DIR/config.json" | awk '{print $1}')"
            sw_vers
          ''',
              '''  echo "model_config_sha256=$(shasum -a 256 "$MODEL_DIR/config.json" | awk '{print $1}')"
            if [[ -f "$MODEL_DIR/native_mtp_adoption.json" ]]; then
              echo "native_mtp_adoption_sha256=$(shasum -a 256 "$MODEL_DIR/native_mtp_adoption.json" | awk '{print $1}')"
            fi
            sw_vers
          ''',
              "runner evidence receipt",
          )
          runner_path.write_text(runner)

          docs_path = Path("benchmarks/M5MAX_QWEN36_QUALIFICATION.md")
          docs = docs_path.read_text()
          docs = replace_once(
              docs,
              '''- target checkpoint: `Qwen/Qwen3.6-27B`
          - native speculative depth exposed by vLLM Metal: one token
          ''',
              '''- target checkpoint: `Qwen/Qwen3.6-27B`
          - preferred ready-made package: `AutomatosX/AX-Qwen3.6-27B-MLX-6bit-MTP`
          - native speculative depth exposed by vLLM Metal: one token
          ''',
              "docs stack",
          )
          docs = replace_once(
              docs,
              '''The reproducible path is to convert the official checkpoint with the exact
          MLX-LM PR head. The runner can do that automatically.
          ''',
              '''The sidecar has now been independently inspected: its 15 BF16 tensors use the
          exact native `mlx-lm#1740` names, dtypes, shapes, and contiguous byte spans. The
          preferred fast path is therefore a fail-closed index adoption, not a tensor rewrite.
          The adopter verifies the AX provenance manifest and full sidecar SHA-256 before it
          creates a separate model directory. Official conversion remains the clean fallback.
          ''',
              "docs model path",
          )
          section_start = docs.index("## One-command run")
          section_end = docs.index("## What is measured", section_start)
          new_section = '''## One-command run

          From this branch on the physical M5 Max, the preferred path is:

          ```bash
          scripts/run_m5max_qwen36_qualification.sh \\
            --model-dir "$HOME/Models/AX-Qwen3.6-27B-6bit-native-mtp" \\
            --prepare-ax
          ```

          This creates a dedicated Python 3.12 environment, installs the exact source
          stack, downloads or reuses the 23.7 GB AX package in the Hugging Face cache,
          validates its 849 MB MTP sidecar, creates a standard-MLX-compatible model
          directory, builds the Metal artifacts, and executes the qualification.

          `--link-mode auto` first tries hardlinks and otherwise uses absolute symlinks,
          so the adopted directory normally consumes almost no duplicate model storage.
          Do not delete the source package when the receipt reports symlink materialization.
          Use `--link-mode copy` when a fully independent second copy is required.

          To adopt a package already downloaded by OMLX or another application:

          ```bash
          scripts/run_m5max_qwen36_qualification.sh \\
            --model-dir "$HOME/Models/AX-Qwen3.6-27B-6bit-native-mtp" \\
            --adopt-ax-sidecar "/path/to/AX-Qwen3.6-27B-MLX-6bit-MTP"
          ```

          The official conversion path remains available:

          ```bash
          scripts/run_m5max_qwen36_qualification.sh \\
            --model-dir "$HOME/Models/Qwen3.6-27B-6bit-native-mtp" \\
            --prepare-official
          ```

          The official BF16 download plus converted output can require roughly 100 GiB
          of temporary/free disk space. Subsequent runs can reuse the environment and
          adopted or converted model:

          ```bash
          scripts/run_m5max_qwen36_qualification.sh \\
            --model-dir "$HOME/Models/AX-Qwen3.6-27B-6bit-native-mtp" \\
            --skip-install
          ```

          To smoke-test the harness on another arm64 Mac, add `--allow-non-m5max`;
          such a run does not qualify an M5 Max performance claim.

          '''
          docs = docs[:section_start] + new_section + docs[section_end:]
          docs_path.write_text(docs)
          PY
          chmod +x scripts/adopt_ax_qwen36_mtp_sidecar.py

      - name: Run contract test and static gates
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install 'ruff==0.16.0'
          ruff check --fix \
            scripts/adopt_ax_qwen36_mtp_sidecar.py \
            benchmarks/qwen_mtp_m5max_qualification.py
          ruff format \
            scripts/adopt_ax_qwen36_mtp_sidecar.py \
            benchmarks/qwen_mtp_m5max_qualification.py
          ruff check \
            scripts/adopt_ax_qwen36_mtp_sidecar.py \
            benchmarks/qwen_mtp_m5max_qualification.py
          ruff format --check \
            scripts/adopt_ax_qwen36_mtp_sidecar.py \
            benchmarks/qwen_mtp_m5max_qualification.py
          python -m py_compile \
            scripts/adopt_ax_qwen36_mtp_sidecar.py \
            benchmarks/qwen_mtp_m5max_qualification.py
          bash -n scripts/run_m5max_qwen36_qualification.sh
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import math
          import struct
          import tempfile
          from pathlib import Path

          module_path = Path("scripts/adopt_ax_qwen36_mtp_sidecar.py").resolve()
          spec = importlib.util.spec_from_file_location("adopter", module_path)
          assert spec and spec.loader
          adopter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(adopter)

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              source = root / "source"
              output = root / "output"
              source.mkdir()
              config = {
                  "model_type": "qwen3_5",
                  "mtp_num_hidden_layers": 1,
                  "quantization": {"bits": 6, "group_size": 64, "mode": "affine"},
                  "text_config": {
                      "hidden_size": 5120,
                      "intermediate_size": 17408,
                      "num_hidden_layers": 64,
                      "mtp_num_hidden_layers": 1,
                  },
              }
              (source / "config.json").write_text(json.dumps(config))
              index = {
                  "metadata": {"total_size": 1},
                  "weight_map": {
                      "language_model.lm_head.weight": "model-00001-of-00001.safetensors"
                  },
              }
              (source / "model.safetensors.index.json").write_text(json.dumps(index))
              (source / "model-00001-of-00001.safetensors").write_bytes(b"x")

              header = {}
              offset = 0
              for key, (dtype, shape) in adopter.EXPECTED_TENSORS.items():
                  size = math.prod(shape) * 2
                  header[key] = {
                      "dtype": dtype,
                      "shape": list(shape),
                      "data_offsets": [offset, offset + size],
                  }
                  offset += size
              payload = json.dumps(header, separators=(",", ":")).encode()
              sidecar = source / "mtp.safetensors"
              with sidecar.open("wb") as handle:
                  handle.write(struct.pack("<Q", len(payload)))
                  handle.write(payload)
                  handle.seek(8 + len(payload) + offset - 1)
                  handle.write(b"\0")
              manifest = {
                  "output": {
                      "mtp": {
                          "path": "mtp.safetensors",
                          "size_bytes": sidecar.stat().st_size,
                          "sha256": "synthetic-sidecar-sha",
                      }
                  }
              }
              (source / "ax_mtp_sidecar_manifest.json").write_text(json.dumps(manifest))

              real_sha = adopter.sha256_file

              def synthetic_sha(path):
                  path = Path(path)
                  if path.name == "mtp.safetensors":
                      return "synthetic-sidecar-sha"
                  return real_sha(path)

              adopter.sha256_file = synthetic_sha
              receipt = adopter.build_adopted_model(source, output, "hardlink")
              adopted_index = json.loads(
                  (output / "model.safetensors.index.json").read_text()
              )
              assert receipt["mtp_tensor_count"] == 15
              assert all(
                  adopted_index["weight_map"][key] == "mtp.safetensors"
                  for key in adopter.EXPECTED_TENSORS
              )
              assert adopted_index["metadata"]["total_size"] == 1 + offset
              assert (output / "native_mtp_adoption.json").is_file()
              assert (output / "mtp.safetensors").stat().st_ino == sidecar.stat().st_ino
          print("AX sidecar adoption contract test passed")
          PY
          git diff --check

      - name: Commit final branch and remove workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/finalize-ax-sidecar-adoption.yml
          git add scripts/adopt_ax_qwen36_mtp_sidecar.py \
            scripts/run_m5max_qwen36_qualification.sh \
            benchmarks/qwen_mtp_m5max_qualification.py \
            benchmarks/M5MAX_QWEN36_QUALIFICATION.md \
            .github/workflows/finalize-ax-sidecar-adoption.yml
          git commit -m 'bench: add validated AX Qwen3.6 sidecar adoption path'
          git push origin HEAD:bench/m5max-qwen36-final-qualification
