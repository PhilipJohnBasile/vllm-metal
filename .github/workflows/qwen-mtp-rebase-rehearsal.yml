name: Rehearse Qwen MTP PR 618 rebase

on:
  workflow_dispatch:
  push:
    branches:
      - handoff-pr-618-20260822
    paths:
      - .github/workflows/qwen-mtp-rebase-rehearsal.yml
      - tools/resolve_qwen_mtp_rebase_conflicts.py
  pull_request:
    branches:
      - handoff-pr-618-20260822

permissions:
  contents: read

concurrency:
  group: qwen-mtp-pr-618-rebase-rehearsal
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    env:
      INTEGRATION_BASE: 150dd3292bd940f2eac1b3442ece21355d8ebf19
      FEATURE_HEAD: 5c1250161a9de28fa5fd734d922a0df604101eb6
      UPSTREAM_MAIN: 211a1e4bc976cd6c0c961cad8da59d649ea9bd65
      REPORT_DIR: /tmp/qwen-mtp-rebase-report
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the exact canonical main tip
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git remote add canonical https://github.com/vllm-project/vllm-metal.git
          git fetch --no-tags canonical "${UPSTREAM_MAIN}"
          git cat-file -e "${INTEGRATION_BASE}^{commit}"
          git cat-file -e "${FEATURE_HEAD}^{commit}"
          git cat-file -e "${UPSTREAM_MAIN}^{commit}"
          cp tools/resolve_qwen_mtp_rebase_conflicts.py /tmp/resolve_qwen_mtp_rebase_conflicts.py
          python -m py_compile /tmp/resolve_qwen_mtp_rebase_conflicts.py

      - name: Record deterministic overlap inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${REPORT_DIR}"
          git diff --name-only "${INTEGRATION_BASE}..${FEATURE_HEAD}" \
            | sort > "${REPORT_DIR}/feature-files.txt"
          git diff --name-only "${INTEGRATION_BASE}..${UPSTREAM_MAIN}" \
            | sort > "${REPORT_DIR}/upstream-files.txt"
          comm -12 \
            "${REPORT_DIR}/feature-files.txt" \
            "${REPORT_DIR}/upstream-files.txt" \
            > "${REPORT_DIR}/overlap-files.txt"
          git log --oneline --reverse \
            "${INTEGRATION_BASE}..${UPSTREAM_MAIN}" \
            > "${REPORT_DIR}/upstream-commits.txt"
          git log --format=fuller --reverse \
            "${INTEGRATION_BASE}..${FEATURE_HEAD}" \
            > "${REPORT_DIR}/feature-commits.txt"

      - name: Replay, resolve known conflicts, and continue both commits
        id: rebase
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p \
            "${REPORT_DIR}/conflicts-first" \
            "${REPORT_DIR}/conflicts-second" \
            "${REPORT_DIR}/resolutions"

          capture_conflicts() {
            local label="$1"
            local destination="$2"
            git status --short > "${REPORT_DIR}/status-${label}-short.txt" || true
            git status > "${REPORT_DIR}/status-${label}.txt" || true
            git diff --name-only --diff-filter=U \
              > "${REPORT_DIR}/conflict-files-${label}.txt" || true
            git ls-files -u > "${REPORT_DIR}/index-unmerged-${label}.txt" || true
            git diff --cc > "${REPORT_DIR}/combined-conflict-${label}.diff" || true
            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              safe_path="${destination}/${path}"
              mkdir -p "$(dirname "${safe_path}")"
              git show ":1:${path}" > "${safe_path}.stage1-base" 2>/dev/null || true
              # During rebase, stage 2 is the new upstream side and stage 3 is
              # the feature commit being replayed.
              git show ":2:${path}" > "${safe_path}.stage2-upstream" 2>/dev/null || true
              git show ":3:${path}" > "${safe_path}.stage3-feature" 2>/dev/null || true
              cp "${path}" "${safe_path}.worktree" 2>/dev/null || true
            done < "${REPORT_DIR}/conflict-files-${label}.txt"
          }

          write_success_report() {
            git rev-parse HEAD > "${REPORT_DIR}/rehearsal-head.txt"
            git log --format=fuller --reverse \
              "${UPSTREAM_MAIN}..HEAD" \
              > "${REPORT_DIR}/rebased-commits.txt"
            git diff --stat "${UPSTREAM_MAIN}..HEAD" \
              > "${REPORT_DIR}/rebased-stat.txt"
            git diff "${UPSTREAM_MAIN}..HEAD" \
              > "${REPORT_DIR}/rebased.patch"
            git diff --check "${UPSTREAM_MAIN}..HEAD"
          }

          git switch --detach "${FEATURE_HEAD}"

          set +e
          git rebase --onto \
            "${UPSTREAM_MAIN}" \
            "${INTEGRATION_BASE}" \
            "${FEATURE_HEAD}" \
            > "${REPORT_DIR}/rebase-initial.stdout.txt" \
            2> "${REPORT_DIR}/rebase-initial.stderr.txt"
          initial_rc=$?
          set -e
          echo "${initial_rc}" > "${REPORT_DIR}/rebase-initial-exit-code.txt"

          if [ "${initial_rc}" -eq 0 ]; then
            echo "clean" > "${REPORT_DIR}/result.txt"
            write_success_report
          else
            capture_conflicts first "${REPORT_DIR}/conflicts-first"

            python /tmp/resolve_qwen_mtp_rebase_conflicts.py \
              > "${REPORT_DIR}/known-resolution.stdout.txt" \
              2> "${REPORT_DIR}/known-resolution.stderr.txt"

            cp vllm_metal/attention/impls/gdn_lazy.py \
              "${REPORT_DIR}/resolutions/gdn_lazy.py.resolved"
            cp vllm_metal/v1/cache_policy.py \
              "${REPORT_DIR}/resolutions/cache_policy.py.resolved"
            diff -u \
              "${REPORT_DIR}/conflicts-first/vllm_metal/attention/impls/gdn_lazy.py.stage2-upstream" \
              "${REPORT_DIR}/resolutions/gdn_lazy.py.resolved" \
              > "${REPORT_DIR}/resolutions/gdn_lazy.upstream-to-resolved.diff" || true
            diff -u \
              "${REPORT_DIR}/conflicts-first/vllm_metal/v1/cache_policy.py.stage2-upstream" \
              "${REPORT_DIR}/resolutions/cache_policy.py.resolved" \
              > "${REPORT_DIR}/resolutions/cache_policy.upstream-to-resolved.diff" || true

            git add \
              vllm_metal/attention/impls/gdn_lazy.py \
              vllm_metal/v1/cache_policy.py

            set +e
            GIT_EDITOR=true git rebase --continue \
              > "${REPORT_DIR}/rebase-continue.stdout.txt" \
              2> "${REPORT_DIR}/rebase-continue.stderr.txt"
            continue_rc=$?
            set -e
            echo "${continue_rc}" > "${REPORT_DIR}/rebase-continue-exit-code.txt"

            if [ "${continue_rc}" -eq 0 ]; then
              echo "resolved-clean" > "${REPORT_DIR}/result.txt"
              write_success_report
            else
              capture_conflicts second "${REPORT_DIR}/conflicts-second"
              echo "conflicted-after-known-resolution" > "${REPORT_DIR}/result.txt"
              git rebase --abort || true
            fi
          fi

          first_count=$(wc -l < "${REPORT_DIR}/conflict-files-first.txt" 2>/dev/null || echo 0)
          second_count=$(wc -l < "${REPORT_DIR}/conflict-files-second.txt" 2>/dev/null || echo 0)
          {
            echo "## PR #618 rebase rehearsal"
            echo
            echo "- Integration base: \`${INTEGRATION_BASE}\`"
            echo "- Feature head: \`${FEATURE_HEAD}\`"
            echo "- Upstream main: \`${UPSTREAM_MAIN}\`"
            echo "- Result: \`$(cat "${REPORT_DIR}/result.txt")\`"
            echo "- Overlapping paths: \`$(wc -l < "${REPORT_DIR}/overlap-files.txt" | tr -d ' ')\`"
            echo "- First-commit conflicts: \`${first_count// /}\`"
            echo "- Remaining conflicts after guarded resolution: \`${second_count// /}\`"
            echo
            echo "The artifact preserves original index stages, guarded resolutions, and any later conflict stages."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate report completeness
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test -s "${REPORT_DIR}/feature-files.txt"
          test -s "${REPORT_DIR}/upstream-files.txt"
          test -f "${REPORT_DIR}/overlap-files.txt"
          test -f "${REPORT_DIR}/result.txt"
          python - <<'PY'
          from pathlib import Path

          root = Path("/tmp/qwen-mtp-rebase-report")
          result = (root / "result.txt").read_text().strip()
          allowed = {
              "clean",
              "resolved-clean",
              "conflicted-after-known-resolution",
          }
          if result not in allowed:
              raise SystemExit(f"unexpected rehearsal result: {result!r}")

          if result in {"clean", "resolved-clean"}:
              for name in (
                  "rehearsal-head.txt",
                  "rebased-commits.txt",
                  "rebased-stat.txt",
                  "rebased.patch",
              ):
                  if not (root / name).exists():
                      raise SystemExit(f"successful rehearsal missing {name}")

          first = root / "conflict-files-first.txt"
          if result == "resolved-clean" and not first.read_text().strip():
              raise SystemExit("resolved-clean result lacks first-conflict record")

          if result == "conflicted-after-known-resolution":
              second = root / "conflict-files-second.txt"
              if not second.read_text().strip():
                  raise SystemExit("later rebase failure lacks an unmerged path")
          PY

      - name: Upload deterministic rebase report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-mtp-pr-618-rebase-rehearsal
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30
