name: Bootstrap M5 Max Qwen3.6 qualification harness

on:
  push:
    branches:
      - bench/m5max-qwen36-final-qualification
    paths:
      - .github/workflows/bootstrap-m5max-qwen36-qualification.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize qualification harness
        shell: bash
        env:
          PY_GZ_B64: 
          SH_GZ_B64: 
          MD_GZ_B64: 
        run: |
          mkdir -p benchmarks scripts
          printf '%s' "$PY_GZ_B64" | base64 --decode | gzip --decompress > benchmarks/qwen_mtp_m5max_qualification.py
          printf '%s' "$SH_GZ_B64" | base64 --decode | gzip --decompress > scripts/run_m5max_qwen36_qualification.sh
          printf '%s' "$MD_GZ_B64" | base64 --decode | gzip --decompress > benchmarks/M5MAX_QWEN36_QUALIFICATION.md
          chmod +x benchmarks/qwen_mtp_m5max_qualification.py scripts/run_m5max_qwen36_qualification.sh

      - name: Validate generated files
        shell: bash
        run: |
          python3 -m py_compile benchmarks/qwen_mtp_m5max_qualification.py
          bash -n scripts/run_m5max_qwen36_qualification.sh
          test -s benchmarks/M5MAX_QWEN36_QUALIFICATION.md

      - name: Commit final harness and remove bootstrap
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/bootstrap-m5max-qwen36-qualification.yml
          git add benchmarks/qwen_mtp_m5max_qualification.py \
            benchmarks/M5MAX_QWEN36_QUALIFICATION.md \
            scripts/run_m5max_qwen36_qualification.sh \
            .github/workflows/bootstrap-m5max-qwen36-qualification.yml
          git commit -m 'bench: add physical M5 Max Qwen3.6 MTP qualification'
          git push origin HEAD:bench/m5max-qwen36-final-qualification
