name: Repair AX sidecar finalizer

on:
  push:
    branches:
      - bench/m5max-qwen36-final-qualification
    paths:
      - .github/workflows/repair-finalize-ax-sidecar.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace nested heredoc and self-remove
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path(".github/workflows/finalize-ax-sidecar-adoption.yml")
          source = path.read_text()
          marker = 'AX_SOURCE_DIR="$(AX_REPO="$AX_REPO" python - <<\'PY\''
          marker_count = source.count(marker)
          if marker_count != 1:
              raise SystemExit(f"expected one AX heredoc marker, found {marker_count}")
          marker_start = source.index(marker)
          start = source.rfind("\n", 0, marker_start) + 1
          terminator = re.search(
              r'\n[ \t]*P' + r'Y[ \t]*\n[ \t]*\)"',
              source[marker_start:],
          )
          if terminator is None:
              raise SystemExit("AX heredoc terminator was not found")
          end = marker_start + terminator.end()
          indent = source[start:marker_start]
          replacement = indent + (
              'AX_SOURCE_DIR="$(AX_REPO="$AX_REPO" python -c '
              '\'import os; from huggingface_hub import snapshot_download; '
              'print(snapshot_download(repo_id=os.environ["AX_REPO"]))\')"'
          )
          path.write_text(source[:start] + replacement + source[end:])
          PY
          rm .github/workflows/repair-finalize-ax-sidecar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-ax-sidecar-adoption.yml \
            .github/workflows/repair-finalize-ax-sidecar.yml
          git commit -m 'ci: repair AX sidecar finalizer quoting'
          git push origin HEAD:bench/m5max-qwen36-final-qualification
