name: Temporary PR 618 integration runner

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-pr-618-integration
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event.pull_request.number == 11 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Attempt exact three-way merge
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail

          report_dir="/tmp/pr-618-merge-report"
          rm -rf "$report_dir"
          mkdir -p "$report_dir"

          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git fetch origin \
            pr/610-05-paged-qwen-mtp-prefix:refs/remotes/origin/pr-618-head

          integration_head=$(git rev-parse HEAD)
          pr_head=$(git rev-parse refs/remotes/origin/pr-618-head)
          merge_base=$(git merge-base HEAD refs/remotes/origin/pr-618-head)

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/pr-618-head \
            >"$report_dir/merge.stdout" 2>"$report_dir/merge.stderr"
          merge_status=$?
          set -e

          git diff --name-only --diff-filter=U | sed '/^$/d' \
            >"$report_dir/conflicts.txt" || true
          conflict_count=$(wc -l <"$report_dir/conflicts.txt" | tr -d ' ')
          git status --porcelain=v2 >"$report_dir/status-porcelain-v2.txt" || true
          git ls-files -u >"$report_dir/unmerged-index.txt" || true
          git diff --cc >"$report_dir/conflicts.diff" || true

          REPORT_DIR="$report_dir" \
          INTEGRATION_HEAD="$integration_head" \
          PR_HEAD="$pr_head" \
          MERGE_BASE="$merge_base" \
          MERGE_STATUS="$merge_status" \
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          directory = Path(os.environ["REPORT_DIR"])
          conflicts = [
              line
              for line in (directory / "conflicts.txt").read_text().splitlines()
              if line
          ]
          generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          merge_status = int(os.environ["MERGE_STATUS"])
          report = {
              "schema_version": 1,
              "generated_at": generated_at,
              "integration_head": os.environ["INTEGRATION_HEAD"],
              "pr_head": os.environ["PR_HEAD"],
              "merge_base": os.environ["MERGE_BASE"],
              "merge_exit_status": merge_status,
              "conflict_count": len(conflicts),
              "conflicts": conflicts,
          }
          (directory / "pr_618_merge_report_20260822.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          lines = [
              "# PR #618 three-way integration report",
              "",
              f"Generated automatically on {generated_at}.",
              "",
              f"- Integration head before merge: `{report['integration_head']}`",
              f"- Preserved PR #618 head: `{report['pr_head']}`",
              f"- Computed merge base: `{report['merge_base']}`",
              f"- Raw merge exit status: `{merge_status}`",
              f"- Unmerged path count: **{len(conflicts)}**",
              "",
          ]
          if merge_status == 0 and not conflicts:
              lines += [
                  "## Result",
                  "",
                  "The merge completed without unresolved paths and was committed",
                  "to the isolated integration branch.",
              ]
          else:
              lines += ["## Unresolved paths", ""]
              lines += [f"- `{path}`" for path in conflicts]
              if not conflicts:
                  lines += [
                      "The merge failed without unmerged index entries; inspect",
                      "the captured stdout and stderr files.",
                  ]
              lines += [
                  "",
                  "No conflict-marker files were committed. Full diagnostics are",
                  "retained in the `pr-618-merge-report` workflow artifact.",
              ]
          (directory / "pr_618_merge_report_20260822.md").write_text(
              "\n".join(lines) + "\n"
          )
          PY

          if [ "$merge_status" -eq 0 ] && [ "$conflict_count" -eq 0 ]; then
            mkdir -p docs
            cp "$report_dir"/pr_618_merge_report_20260822.* docs/
            git add docs/pr_618_merge_report_20260822.md \
              docs/pr_618_merge_report_20260822.json
            git commit -m "merge: integrate PR #618 onto current main

Three-way merge of the preserved #618 head on the isolated integration branch.

Signed-off-by: Philip John Basile <PBasile@Basilecom.com>"
          else
            git merge --abort || true
            mkdir -p docs
            cp "$report_dir"/pr_618_merge_report_20260822.* docs/
            git add docs/pr_618_merge_report_20260822.md \
              docs/pr_618_merge_report_20260822.json
            git commit -m "docs: record exact PR #618 merge conflicts [skip integration]

No conflict-marker source files are committed.

Signed-off-by: Philip John Basile <PBasile@Basilecom.com>"
          fi

          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload merge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-618-merge-report
          path: /tmp/pr-618-merge-report
          if-no-files-found: warn
